<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>
<th:block th:fragment="site-header">
    <header class="site-header">
        <div class="left">
            <a href="/" class="logo">Групповая премия</a>
            <nav>
                <a href="/nominations">Номинации</a>

                <!-- Ссылка "Админка" видна только ADMIN -->
                <a th:if="${currentUser != null and currentUser.role == 'ADMIN'}"
                   href="/admin">
                    Админка
                </a>
            </nav>
        </div>
        <div class="right">
            <span th:if="${currentUser != null}">
                Привет,
                <strong th:text="${currentUser.name != null ? currentUser.name : currentUser.login}">
                    Гость
                </strong>!
                <button type="button" class="logout-btn" data-logout-button>Выйти</button>
            </span>
            <span th:if="${currentUser == null}">
                <a href="/login">Войти</a>
            </span>
        </div>
    </header>
</th:block>
</body>
</html>
