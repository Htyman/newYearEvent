<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div th:replace="fragments/header :: site-header"></div>

<main>
    <div class="login-container">
        <h1>Вход</h1>
        <p style="font-size: 13px; color: #555;">
            Введите логин и пароль, которые админ выдал для голосования.
        </p>
        <form data-login-form>
            <label>
                Логин:
                <input type="text" name="login" required>
            </label>
            <label>
                Пароль:
                <input type="password" name="password" required>
            </label>
            <button type="submit">Войти</button>
            <div data-login-error class="message error"></div>
            <div data-login-success class="message success"></div>
        </form>
    </div>
</main>

<div th:replace="fragments/footer :: site-footer"></div>

<script src="/js/login.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
