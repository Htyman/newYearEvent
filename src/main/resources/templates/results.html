<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоги премии</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/results.css}">
</head>
<body>

<div th:replace="fragments/header :: site-header"></div>

<main>
    <h1>Итоги премии</h1>

    <p class="results-intro">
        Здесь показаны результаты по закрытым номинациям.
        Как только номинация закрывается, она появляется в этом списке.
    </p>

    <div th:if="${#lists.isEmpty(items)}">
        Пока нет закрытых номинаций. Загляните позже!
    </div>

    <div th:each="item : ${items}" class="results-nomination-card">
        <h2>
            <span th:text="${item.nomination.name}">Номинация</span>
            <span class="badge badge-closed">Закрыта</span>
        </h2>
        <p th:text="${item.nomination.description}">Описание...</p>

        <div th:if="${item.winner != null}" class="winner-block">
            Победитель:
            <strong th:text="${item.winner.name + ' ' + (item.winner.surname != null ? item.winner.surname : '')}">
                Имя Фамилия
            </strong>
            (<span th:text="${item.winner.votes}">0</span> голосов)
        </div>

        <table th:if="${!#lists.isEmpty(item.results)}" class="results-table">
            <thead>
            <tr>
                <th>Кандидат</th>
                <th>Голосов</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${item.results}">
                <td th:text="${r.name + ' ' + (r.surname != null ? r.surname : '')}">Имя Фамилия</td>
                <td th:text="${r.votes}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="fragments/footer :: site-footer"></div>

<script src="/js/app.js"></script>
</body>
</html>
